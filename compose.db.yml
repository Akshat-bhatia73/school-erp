services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: erp_migrator
      POSTGRES_PASSWORD: erp_migrator
      POSTGRES_DB: erp
    ports:
      - '127.0.0.1:54329:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U erp_migrator -d erp']
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - erp-postgres-data:/var/lib/postgresql
      - ./packages/db/docker-init:/docker-entrypoint-initdb.d:ro

volumes:
  erp-postgres-data:
