packages:
  - "apps/*"
  - "packages/*"
  - "tests/*"

# brace-expansion reaches us through exceljs > archiver > glob/readdir-glob >
# minimatch; GHSA-qhr7-859c-m2p7 and GHSA-6j4f-fj2g-mc7p are fixed in 1.1.20
# and 2.1.6, which exceljs's own ranges do not pick up yet.
overrides:
  "brace-expansion@<1.1.20": "^1.1.20"
  "brace-expansion@>=2.0.0 <2.1.6": "^2.1.6"
  # source-map-js reaches us through @tailwindcss/vite > @tailwindcss/node;
  # GHSA-68fv-2mgg-jv7q is fixed in 1.2.2.
  "source-map-js@>=1.0.0 <1.2.2": "^1.2.2"
